<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قيد التطوير | يوم المرأة العمانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --lilac:#bdaed6; --lilac-deep:#9d86c6; --mint:#6dbd8c; --plum:#612c90;
  --ink:#2c1747; --paper:#ffffff; --muted:#6f6385; --ribbon:#4fae78;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--body); color:var(--ink); background:var(--lilac);
  background-image:radial-gradient(ellipse 60% 62% at 50% 50%, var(--mint) 0%, #8cb6a6 38%, #a9b0c9 66%, var(--lilac) 100%);
}
.stage{
  position:relative; min-height:100%; display:grid; place-items:center; overflow:hidden; isolation:isolate;
  padding-block:24px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.frame{position:absolute; inset:0; z-index:-1; pointer-events:none; background:url("../assets/frame.webp") center/100% 100% no-repeat; opacity:.95}
.logos{position:absolute; top:calc(env(safe-area-inset-top,0px) + 20px); right:max(20px, env(safe-area-inset-right,0px)); width:clamp(150px,20vw,280px)}
.logos img{display:block; width:100%; height:auto}

.card{
  width:100%; max-width:520px; background:var(--paper); border-radius:28px;
  padding:clamp(28px,5vw,44px) clamp(22px,4vw,40px); text-align:center;
  box-shadow:0 0 0 8px var(--plum), 0 0 0 13px var(--lilac), 0 24px 60px rgba(50,20,90,.35);
  display:flex; flex-direction:column; align-items:center; gap:16px; margin-top:60px;
}
.bloom{width:110px; height:110px; position:relative}
.bloom img{width:100%; height:100%; object-fit:contain; animation:grow 3.2s ease-in-out infinite}
.badge{font-size:13px; font-weight:600; letter-spacing:.04em; color:var(--plum); background:#efe9f7; padding:5px 14px; border-radius:999px}
h1{margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px,5vw,42px); color:var(--plum); line-height:1.2; text-wrap:balance}
p{margin:0; color:var(--muted); font-size:clamp(15px,2.2vw,18px); line-height:1.8; max-width:36ch}
.bar{width:100%; max-width:280px; height:10px; background:#efe9f7; border-radius:999px; overflow:hidden}
.bar span{display:block; height:100%; width:40%; border-radius:999px; background:linear-gradient(90deg,var(--lilac-deep),var(--mint)); animation:load 2.4s ease-in-out infinite}
.ribbon{margin-top:6px; font-family:var(--display); font-weight:600; font-size:clamp(17px,2.4vw,22px); color:var(--ribbon); padding:.2em 1.3em .3em; border-radius:999px; box-shadow:0 0 0 5px var(--plum)}

@keyframes grow{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.07) rotate(4deg)}}
@keyframes load{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
@media (prefers-reduced-motion:reduce){.bloom img,.bar span{animation:none}}
@media (max-width:640px){
  .frame{background-size:cover; opacity:.6}
  .logos{right:auto; left:50%; translate:-50% 0}
}
</style>
</head>
<body>
<main class="stage">
  <div class="frame" aria-hidden="true"></div>
  <div class="logos"><img src="../assets/logos.webp" alt="لِعُمان For Oman"></div>

  <section class="card">
    <div class="bloom"><img src="../assets/lily-b.webp" alt="" aria-hidden="true"></div>
    <span class="badge">قيد التطوير</span>
    <h1>نُجهّز لكِ شيئاً جميلاً</h1>
    <p>هذه الصفحة قيد التطوير حالياً، وستكون متاحة قريباً بمناسبة يوم المرأة العُمانية.</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <p class="ribbon">بها يزدهر الوطن</p>
  </section>
</main>
</body>
</html>
