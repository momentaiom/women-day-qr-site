<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-store">
<title>جاري التحويل…</title>
<style>
  :root{--lilac:#bdaed6;--mint:#6dbd8c;--ink:#2c1747;--paper:#fff;color-scheme:light}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;color:var(--ink);
    background:var(--lilac);background-image:radial-gradient(ellipse 70% 60% at 50% 50%,var(--mint),var(--lilac));padding:16px}
  .card{background:var(--paper);border-radius:22px;padding:28px 32px;text-align:center;box-shadow:0 0 0 6px #612c90,0 18px 40px rgba(50,20,90,.3);max-width:360px}
  .dot{width:38px;height:38px;margin:0 auto 14px;border-radius:50%;border:4px solid #d9cfea;border-top-color:#612c90;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  a{color:#612c90;font-weight:600}
  p{margin:.4em 0}
</style>
</head>
<body>
  <div class="card">
    <div class="dot" aria-hidden="true"></div>
    <p>جاري فتح الرابط…</p>
    <p id="fallback" hidden><a id="manual" href="#">اضغطي هنا إن لم يُفتح تلقائياً</a></p>
  </div>
<script>
(function(){
  var fb = document.getElementById("fallback"), a = document.getElementById("manual");
  fetch("../link.json?t=" + Date.now(), {cache: "no-store"})
    .then(function(r){ return r.json(); })
    .then(function(j){
      var u = (j && j.url || "").trim();
      if (!/^https?:\/\//i.test(u)) throw new Error("bad url");
      a.href = u; fb.hidden = false;
      location.replace(u);
    })
    .catch(function(){ fb.hidden = false; a.textContent = "تعذّر قراءة الرابط، حاولي مرة أخرى"; a.href = location.href; });
})();
</script>
</body>
</html>
