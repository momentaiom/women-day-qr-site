<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>يوم المرأة العمانية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   الإعداد الوحيد الذي تحتاجه:
   ضع هنا الرابط الثابت الذي سيُطبع داخل رمز QR (دومينك + /go/).
   اتركه فارغاً ليُبنى تلقائياً من عنوان الموقع الحالي.
   ===================================================================== */
</style>
<script>
  window.QR_FIXED_URL = "https://momentaiom.github.io/women-day-qr-site/go/"; // مثال: "https://women-day.om/go/"
</script>
<style>
/* Layout: one still screen — lilac/mint radial field, lily frame at the edges,
   title above, white QR plaque dead centre, slogan ribbon below. Single brand look. */
:root{
  --lilac:#bdaed6; --lilac-deep:#9d86c6; --mint:#6dbd8c; --plum:#612c90;
  --ink:#2c1747; --paper:#ffffff; --ribbon-text:#4fae78;
  --display:"Reem Kufi","IBM Plex Sans Arabic","Noto Kufi Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--body); color:var(--paper);
  background:var(--lilac);
  background-image:radial-gradient(ellipse 60% 62% at 50% 50%, var(--mint) 0%, #8cb6a6 38%, #a9b0c9 66%, var(--lilac) 100%);
  overflow-x:hidden;
}
.stage{
  position:relative; min-height:100%; display:grid; place-items:center;
  padding-block:clamp(16px,3vh,40px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  isolation:isolate; overflow:hidden;
}
.frame{
  position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:url("assets/frame.webp") center/100% 100% no-repeat;
  opacity:.95;
}
.lily{position:absolute; z-index:-1; pointer-events:none; filter:drop-shadow(0 6px 14px rgba(70,40,110,.18))}
.lily.a{width:clamp(70px,9vw,150px); top:14%; inset-inline-start:calc(50% + clamp(120px,16vw,300px)); rotate:18deg; animation:sway 9s ease-in-out infinite}
.lily.b{width:clamp(60px,7vw,120px); bottom:12%; inset-inline-end:calc(50% + clamp(140px,17vw,320px)); rotate:-20deg; animation:sway 11s ease-in-out -3s infinite}

.logos{
  position:absolute; top:calc(env(safe-area-inset-top,0px) + clamp(12px,3vh,32px));
  inset-inline-start:max(clamp(16px,3vw,48px), env(safe-area-inset-right,0px));
  width:clamp(150px,20vw,300px);
}
.logos img{display:block; width:100%; height:auto}

.center{display:flex; flex-direction:column; align-items:center; gap:clamp(14px,2.6vh,28px); text-align:center; padding-top:clamp(56px,8vh,90px)}
h1{
  margin:0; font-family:var(--display); font-weight:700; line-height:1.05;
  font-size:clamp(40px,6.4vw,104px); color:var(--paper); text-wrap:balance;
  -webkit-text-stroke:2px var(--lilac-deep); paint-order:stroke fill;
  text-shadow:
    -2px 2px 0 #d9cfea, -4px 4px 0 #d3c7e6, -6px 6px 0 #cbbde0, -8px 8px 0 var(--lilac-deep),
    -8px 12px 22px rgba(60,30,100,.25);
}
.plaque{
  position:relative; background:var(--paper); border-radius:28px;
  padding:clamp(14px,1.8vw,26px);
  box-shadow:0 0 0 clamp(6px,.7vw,10px) var(--plum), 0 0 0 clamp(9px,1vw,14px) var(--lilac), 0 24px 60px rgba(50,20,90,.35);
}
#qr{width:clamp(200px,min(30vw,38vh),400px); aspect-ratio:1; max-width:100%}
#qr svg{display:block; width:100%; height:100%}
.plaque .petal{position:absolute; width:clamp(54px,6vw,96px); pointer-events:none}
.plaque .petal.tl{top:-38%; inset-inline-start:-34%; translate:0 50%; rotate:-28deg}
.plaque .petal.br{bottom:-20%; inset-inline-end:-26%; rotate:150deg}

.ribbon{
  margin:0; font-family:var(--display); font-weight:600; letter-spacing:.06em;
  font-size:clamp(18px,1.9vw,30px); color:var(--ribbon-text);
  background:var(--paper); padding:.25em 1.4em .35em; border-radius:999px;
  box-shadow:0 0 0 6px var(--plum);
}
@keyframes sway{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-10px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.lily{animation:none}}
@media (max-width:640px){
  .frame{background-size:cover; opacity:.6}
  .lily{display:none}
  .logos{inset-inline-start:auto; left:50%; translate:-50% 0}
  .center{padding-top:clamp(70px,14vw,110px)}
}
</style>
</head>
<body>
<main class="stage">
  <div class="frame" aria-hidden="true"></div>
  <img class="lily a" src="assets/lily-a.webp" alt="" aria-hidden="true">
  <img class="lily b" src="assets/lily-b.webp" alt="" aria-hidden="true">

  <div class="logos"><img src="assets/logos.webp" alt="لِعُمان For Oman"></div>

  <section class="center">
    <h1>يوم المرأة<br>العُمانية</h1>
    <div class="plaque">
      <div id="qr" role="img" aria-label="رمز QR"></div>
    </div>
    <p class="ribbon">بها يزدهر الوطن</p>
  </section>
</main>

<script src="assets/qrcode.js"></script>
<script>
(function(){
  var url = (window.QR_FIXED_URL || "").trim() || new URL("go/", location.href).href;
  var box = document.getElementById("qr");
  try{
    var qr = qrcode(0, "Q");
    qr.addData(url); qr.make();
    var n = qr.getModuleCount(), m = 3, size = n + m*2, d = "";
    for (var r=0;r<n;r++) for (var c=0;c<n;c++) if (qr.isDark(r,c)) d += "M"+(c+m)+" "+(r+m)+"h1v1h-1z";
    box.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#2c1747"/></svg>';
    box.setAttribute("aria-label", "رمز QR يفتح " + url);
    box.title = url;
  }catch(e){ box.textContent = url; }
})();
</script>
</body>
</html>
